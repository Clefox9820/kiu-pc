# Fails any push or pull request that carries something from the game: a
# dump, the code 3dsrecomp translates from it, what that compiles into, or
# anything big enough to be one of them. The repository holds code written
# by people, nothing else. Every commit the push or pull request adds is
# checked, not only the last one: a subtree squash commit carries upstream's
# whole tree, screenshots included, even when the merge drops them.
name: no game files

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List the commits to check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          has() { git cat-file -e "$1^{commit}" 2>/dev/null; }
          if [ "$EVENT" = pull_request ]; then
            tip=$HEAD_SHA base=$BASE_SHA
          else
            tip=$AFTER base=$BEFORE
          fi
          : > "$RUNNER_TEMP/commits"
          if [ -z "$tip" ] || [ "$tip" = "$zero" ]; then
            echo "A branch or tag was deleted; nothing to check."
            exit 0
          fi
          if [ -z "$base" ] || [ "$base" = "$zero" ] || ! has "$base"; then
            # a new branch or tag, or rewritten history: what the default
            # branch does not have yet
            base=
            if has "origin/$DEFAULT_BRANCH"; then base="origin/$DEFAULT_BRANCH"; fi
          fi
          {
            echo "$tip"
            if [ -n "$base" ]; then git rev-list "$tip" --not "$base"; else git rev-list "$tip"; fi
          } | sort -u > "$RUNNER_TEMP/commits"
          echo "$(wc -l < "$RUNNER_TEMP/commits") commits to check"

      - name: No dumps, translated code, binaries, build output, pictures or big files
        run: bash .github/scripts/no-game-files.sh < "$RUNNER_TEMP/commits"
